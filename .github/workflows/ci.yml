name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Installs the ruff pin from the [dev] extra. There used to be a second
        # `pip install ruff==<version>` step here, which ran after this one and
        # therefore won over pyproject: editing the pin there would have changed
        # nothing in CI. The pin lives in pyproject alone so that local runs and
        # CI cannot disagree about the version.
        run: pip install -e ".[dev]"

      # Der Pin wirkt nur, wenn `ruff` ihn auch aufruft: liegt frueher im
      # PATH ein anderes ruff, gewinnt jenes, und der Install meldet nichts.
      - name: Ruff-Pin (PATH und Modul gegen pyproject.toml)
        run: python scripts/check_ruff_pin.py

      - name: Lint with ruff
        run: ruff check src/ tests/ scripts/

      - name: Format check
        run: ruff format --check src/ tests/ scripts/

      - name: Syntax check
        run: python -m py_compile src/srgssr_mcp/server.py

      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py

      # Dependabot legt ein Label nicht an, das in dependabot.yml steht und im
      # Repo fehlt — es kommentiert nur an jedem PR. Genau so ist es hier
      # passiert: unter PR #48 vom 30.7.2026 steht die Meldung, und aufgefallen
      # ist sie einen Monat lang niemandem. Der Token ist der Standard-
      # GITHUB_TOKEN; ohne ihn faellt der Check hier absichtlich, statt still
      # zu ueberspringen.
      - name: Dependabot-Labels (Deklaration ↔ Repo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_dependabot_labels.py
