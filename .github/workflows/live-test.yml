name: Live Tests (Nightly)

on:
  schedule:
    - cron: "0 4 * * *"  # 04:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # the failure reporter opens or updates an issue

jobs:
  live-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Missing secrets used to be indistinguishable from a healthy API: the
      # live_credentials fixture skips every test, pytest exits 0, and the
      # nightly reports green while checking nothing. That is the exact failure
      # mode that let four dead API basepaths survive a release.
      #
      # The credential check that guarded against it lives here now, in the
      # suite step, because a separate step could only say "fail" — and a bare
      # failure was read one step further down as "the API drifted", filing an
      # issue about a schema change nobody had looked for. Missing secrets are
      # not a drift; they are a run that never happened. `not_started` says so
      # in the caller's own words instead of borrowing an exit code.
      #
      # `continue-on-error` so the verdict step runs either way. The job turns
      # red further down, out of the classified result.
      - name: Run live tests
        id: suite
        continue-on-error: true
        env:
          SRGSSR_CONSUMER_KEY: ${{ secrets.LIVE_TEST_CONSUMER_KEY }}
          SRGSSR_CONSUMER_SECRET: ${{ secrets.LIVE_TEST_CONSUMER_SECRET }}
        run: |
          set +e
          if [ -z "$SRGSSR_CONSUMER_KEY" ] || [ -z "$SRGSSR_CONSUMER_SECRET" ]; then
            echo "LIVE_TEST_CONSUMER_KEY / LIVE_TEST_CONSUMER_SECRET are not set."
            echo "not_started=LIVE_TEST_CONSUMER_KEY / LIVE_TEST_CONSUMER_SECRET are not set in this repository, so the live suite was never started. Nothing was checked against the SRG SSR APIs." \
              >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pytest -m live -v --junitxml=live-report.xml 2>&1 | tee live-output.txt
          echo "pytest_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # `if: failure()` knows red and not-red. A live run has three answers, and
      # the third is the one that matters: a failed `pip install`, a timeout or
      # a renamed marker are NOT the same as an API that changed shape — but
      # under `failure()` they look identical, and the issue below then claims a
      # drift nobody measured. A run in which every test skipped exits 0 and
      # looks like success under any exit-code check.
      - name: Classify the run
        id: verdict
        env:
          PYTEST_EXIT: ${{ steps.suite.outputs.pytest_exit }}
          NOT_STARTED: ${{ steps.suite.outputs.not_started }}
        run: |
          # Exactly one of the two is set: either pytest ran (an exit code) or
          # it did not (a reason). An empty `--pytest-exit` is not an exit code,
          # it is an argparse error.
          args=(live-report.xml)
          if [ -n "$NOT_STARTED" ]; then
            args+=(--not-started "$NOT_STARTED")
          elif [ -n "$PYTEST_EXIT" ]; then
            args+=(--pytest-exit "$PYTEST_EXIT")
          fi
          python scripts/classify_live_run.py "${args[@]}"

      # Deliberately not gated on `github.event_name == 'schedule'`. It was, and
      # that made the manual trigger a trap: someone suspecting a schema drift
      # runs the suite by hand, it goes red, and nothing is filed — the result
      # exists only for whoever thinks to open the Actions tab. A hand-started
      # run is the one most likely to be checking a real suspicion, so it is the
      # last one that should stay silent.
      - name: Notify on failure
        if: steps.verdict.outputs.state == 'finding'
        uses: actions/github-script@v9
        with:
          script: |
            // One stable title across both triggers, because it is the dedupe
            // key below: a run-specific title would file a fresh issue every
            // time. Which trigger produced the run is recorded in the body.
            const title = "Live tests failed (possible API schema drift)";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const trigger = context.eventName === "schedule" ? "Nightly run" : "Manual run";

            // A drifted API stays drifted, so an unconditional issues.create()
            // would file one report per night for the same break. Reuse the
            // open one and let the comment count show how long it has run.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "live-tests",
              per_page: 100,
            });
            // Prefix, not equality. Equality made the dedupe depend on nobody
            // ever touching the title: appending context to it — "… — seit dem
            // 15.8." — silently turned the reuse branch off, and the next red
            // run opened a second issue beside the one being worked on. The
            // stable title is the identity; whatever a human adds after it is
            // annotation, not a different report.
            const existing = open.find((issue) => issue.title.startsWith(title));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing — ${trigger.toLowerCase()}: ${runUrl}`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                `${trigger}: live tests against the SRG SSR APIs failed.`,
                "",
                `Workflow run: ${runUrl}`,
                "",
                "Check the failing assertions in `tests/test_live.py` — they read typed",
                "fields off the tool responses, so a failure points at the field that",
                "changed shape rather than at a missing substring.",
                "",
                "Close this issue once the tests pass again; the next failure opens a new one.",
              ].join("\n"),
              labels: ["bug", "live-tests"],
            });

      # Only here does the job turn red. `clear` is green; `finding` and
      # `unknown` are both red, but only `finding` filed an issue above — the
      # difference is in the log, not in the exit code.
      #
      # Through `env`, not `${{ }}` inside the script: the reason can carry a
      # parser message about someone else's file, and `${{ }}` substitutes it
      # into the shell verbatim before the shell starts.
      - name: Surface the verdict
        if: steps.verdict.outputs.state != 'clear'
        env:
          LIVE_STATE: ${{ steps.verdict.outputs.state }}
          LIVE_REASON: ${{ steps.verdict.outputs.reason }}
        run: |
          echo "Live suite: $LIVE_STATE"
          echo "$LIVE_REASON"
          exit 1
